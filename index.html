<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha médica de emergencia</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14213d;--muted:#5b6475;--line:#d9dde5;--red:#c8102e;--on-red:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1a202c;--ink:#f1f3f7;--muted:#a3adbf;--line:#2d3648;--red:#ff4d63;--on-red:#10141c}}
:root[data-theme="dark"]{--bg:#10141c;--card:#1a202c;--ink:#f1f3f7;--muted:#a3adbf;--line:#2d3648;--red:#ff4d63;--on-red:#10141c}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:480px;margin:0 auto;padding:20px 16px 32px}
header{border-left:6px solid var(--red);padding-left:12px;margin-bottom:20px}
header p{margin:0;color:var(--muted);font-size:.95rem}
h1{margin:2px 0 0;font-size:1.5rem;line-height:1.2}
.name{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.name span,.row span{display:block;color:var(--muted);font-size:.85rem}
.name strong{display:block;font-size:1.35rem;line-height:1.25;margin-top:2px}
.blood{display:flex;align-items:center;gap:16px;background:var(--red);color:var(--on-red);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.blood b{font-size:2.6rem;line-height:1}
.blood span{font-size:1rem}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.row{padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row strong{font-size:1.1rem;font-weight:600}
.tip{margin:6px 0 0;font-size:.95rem;color:var(--muted)}
.call{display:block;text-align:center;text-decoration:none;background:var(--ink);color:var(--bg);font-weight:700;font-size:1.15rem;padding:16px;border-radius:10px}
.call:focus-visible,.wa:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.wa{display:block;text-align:center;text-decoration:none;background:#128c4a;color:#fff;font-weight:700;font-size:1.15rem;padding:16px;border-radius:10px;margin-top:12px}
.lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:12px}
.lang button{font:inherit;font-size:.9rem;font-weight:700;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lang button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<main>
<div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es">Español</button><button type="button" data-lang="en">English</button></div>
<header>
<p data-i>card</p>
<h1 data-i>title</h1>
</header>

<div class="name"><span data-i>name</span><strong>Guimera Gauna Ximena Soledad</strong></div>

<div class="blood"><b>0+</b><span data-i>blood</span></div>

<div class="list">
<div class="row"><span data-i>med</span><strong data-i>medv</strong></div>
<div class="row"><span data-i>hist</span><strong data-i>histv</strong><p class="tip" data-i>tip</p></div>
<div class="row"><span data-i>dni</span><strong>32.956.153</strong></div>
<div class="row"><span data-i>nat</span><strong data-i>natv</strong></div>
<div class="row"><span data-i>cel</span><strong>291 446-0195</strong></div>
</div>

<a class="call" href="tel:+542914460195" data-i>call</a>
<a class="wa" href="https://wa.me/5492914460195" data-i>wa</a>
</main>
<script>
var T={
es:{card:"Ficha médica de emergencia",title:"Si necesito ayuda, estos son mis datos",name:"Nombre",blood:"Factor sanguíneo: cero positivo",med:"Medicación",medv:"Venlafaxina, triptanol",hist:"Antecedentes médicos",histv:"Síndrome vasovagal",tip:"Si me desmayo, acuéstame de inmediato y eleva mis piernas para facilitar que la sangre regrese al cerebro. Si no puedes acostarme, ayúdame a sentarme e inclina mi cabeza entre las rodillas.",dni:"DNI",nat:"Nacionalidad",natv:"Argentina",cel:"Celular",call:"Llamar al 291 446-0195",wa:"Escribir por WhatsApp",ttl:"Ficha médica de emergencia"},
en:{card:"Medical emergency card",title:"If I need help, here is my information",name:"Name",blood:"Blood type: O positive",med:"Medication",medv:"Venlafaxine, Triptanol",hist:"Medical history",histv:"Vasovagal syndrome",tip:"If I faint, lay me down right away and raise my legs so blood can return to my brain. If you can\u2019t lay me down, help me sit and lean my head down between my knees.",dni:"National ID (DNI)",nat:"Nationality",natv:"Argentine",cel:"Mobile phone",call:"Call 291 446-0195",wa:"Message on WhatsApp",ttl:"Medical emergency card"}
};
function setLang(l){
  document.documentElement.lang=l;
  document.title=T[l].ttl;
  document.querySelectorAll("[data-i]").forEach(function(e){
    if(!e.dataset.k){e.dataset.k=e.textContent.trim();}
    e.textContent=T[l][e.dataset.k];
  });
  document.querySelectorAll(".lang button").forEach(function(b){
    b.setAttribute("aria-pressed",String(b.dataset.lang===l));
  });
}
document.querySelectorAll(".lang button").forEach(function(b){
  b.addEventListener("click",function(){
    setLang(b.dataset.lang);
    try{localStorage.setItem("lang",b.dataset.lang);}catch(e){}
  });
});
var start=(navigator.language||"es").slice(0,2)==="en"?"en":"es";
try{var s=localStorage.getItem("lang");if(s==="es"||s==="en"){start=s;}}catch(e){}
setLang(start);
</script>
</body>
</html>
